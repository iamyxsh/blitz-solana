[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["magicblock-validator"]

[workspace.package]
edition = "2024"
rust-version = "1.85"  # edition 2024 minimum; the SBF toolchain ships 1.89
license = "MIT OR Apache-2.0"

[workspace.dependencies]
mb-constants = { path = "crates/constants" }
mb-receipt = { path = "crates/receipt" }
mb-slashing = { path = "crates/slashing" }
mb-slashing-program = { path = "crates/program", default-features = false, features = ["no-entrypoint"] }
mb-court = { path = "crates/court" }

base64 = "0.22"
bincode = "1.3"
blake3 = "1.8"
ed25519-dalek = "2"
sha2 = "0.10"
thiserror = "2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-hash = "4.2"
solana-keypair = "=3.1.0"
solana-message = { version = "3.0", features = ["serde"] }
solana-pubkey = "4.1"
solana-signature = "3.1"
solana-signer = "3.0"
solana-system-transaction = "3.0"
solana-transaction = { version = "3.0", features = ["serde", "bincode"] }
ureq = { version = "2.10", features = ["json"] }
bs58 = "0.5"
solana-client = "2.1"
solana-sdk = "2.1"
