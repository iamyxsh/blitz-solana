[package]
name = "magicblock-receipts"
version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
async-trait = { workspace = true }
mb-receipt = { workspace = true }
magicblock-core = { workspace = true }
magicblock-ledger = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
# The workspace pins ed25519-dalek 1.x for legacy solana deps; the receipt spec
# needs the 2.x API, which solana-keypair 3.1 already resolves to.
ed25519-dalek = "2"
solana-keypair = { workspace = true }
solana-signature = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
solana-signer = { workspace = true }
solana-signature = { workspace = true }
bs58 = { workspace = true }
hex = "0.4"
tempfile = { workspace = true }
